<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webowy Silnik Gier 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login-screen" class="screen">
    <h2>Logowanie</h2>
    <input type="text" id="username" placeholder="Login (np. admin)" value="admin">
    <input type="password" id="password" placeholder="Hasło (np. 123)" value="123">
    <button onclick="login()">Zaloguj</button>
    <p id="login-error" style="color: red;"></p>
</div>

<div id="editor-screen" class="screen" style="display: none;">
    <header>
        <h2>2D Engine - Edytor Sceny</h2>
        <div>
            <button onclick="saveProject()">Zapisz Projekt (JSON)</button>
            <button onclick="playMode()">Play Mode</button>
            <button onclick="logout()">Wyloguj</button>
        </div>
    </header>

    <div class="workspace">
        <div class="tools">
            <h3>Narzędzia</h3>
            <label>Wybierz typ pola (Tile):</label>
            <select id="tile-type">
                <option value="0">Trawa (Puste)</option>
                <option value="1">Ściana (Zderzenie)</option>
                <option value="2">Gracz / NPC</option>
            </select>
            <p id="status-msg" style="color: green; margin-top: 20px;"></p>
        </div>

        <div class="canvas-container">
            <canvas id="game-canvas" width="400" height="400"></canvas>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
